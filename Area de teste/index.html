<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Site Dentista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <h2 class="logo">Dr Helem<span>Kauane</span></h2>
      <ul class="menu">
        <li><a href="#">Início</a></li>
        <li><a href="#">Cursos</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </div>
  </header>

  <!-- HERO / SLIDER -->
  <section class="hero">
    <div class="slider">

      <div class="slide active">
        <img src="img/img1.png" alt="slider1">
      </div>

      <div class="slide">
        <img src="img/img2.png" alt="slider2">
      </div>

      <div class="slide">
        <img src="img/img3.png" alt="slider3">
      </div>

      <div class="slide">
        <img src="img/img4.png" alt="slider4">
      </div>

      <!-- SETAS -->
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>

    </div>
  </section>

  <!-- CURSOS -->
  <section class="courses">
  <span class="section-label">MATERIAIS</span>

  <div class="carousel">

    <div class="carousel-track">

      <!-- CARD 1 -->
      <div class="course-card">
        <div class="course-image">
          <img src="img/img1.png">
        </div>
        <div class="course-content">
          <h4>Papelaria Editável para Dentistas</h4>
          <a href="#" class="btn-course">Acessar</a>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="course-card">
        <div class="course-image">
          <img src="img/img2.png">
        </div>
        <div class="course-content">
          <h4>Documentos para HOF</h4>
          <a href="#" class="btn-course">Acessar</a>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="course-card">
        <div class="course-image">
          <img src="img/img3.png">
        </div>
        <div class="course-content">
          <h4>Guia Ilustrado Odontopediatria</h4>
          <a href="#" class="btn-course">Acessar</a>
        </div>
      </div>

      <!-- DUPLIQUE se quiser mais -->
      <div class="course-card">
        <div class="course-image">
          <img src="img/img4.png">
        </div>
        <div class="course-content">
          <h4>Guia Completo de Ortodontia</h4>
          <a href="#" class="btn-course">Acessar</a>
        </div>
      </div>
    </div>

    <button class="carousel-btn next">&#10095;</button>

  </div>
</section>


  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 - Todos os direitos reservados</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
